<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutorial - Five Nights at the Black House</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #000; 
            color: #fff; 
            font-family: 'Courier New', Courier, monospace; 
            overflow: hidden; 
            user-select: none;
        }

        /* --- NEW: Start Screen --- */
        #start-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100; /* Sits on top of everything else */
            cursor: pointer;
            transition: opacity 1s ease-in-out;
        }

        #start-text {
            font-size: 1.5rem;
            color: #aaa;
            animation: slowPulse 2s infinite;
            user-select: none;
        }

        @keyframes slowPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Slowly zooming background container */
        #bg-layer {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out, background-image 1.5s ease-in-out;
            animation: slowPan 10s linear infinite alternate;
            z-index: 1;
        }

        @keyframes slowPan {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        /* CRT Static Overlay */
        #static-overlay {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: repeating-linear-gradient(
                0deg, rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.15) 2px, transparent 2px, transparent 4px
            );
            pointer-events: none;
            z-index: 5;
            opacity: 0.6;
        }

        /* Tutorial Text Container */
        #text-container {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            text-align: center;
            z-index: 10;
        }

        #tutorial-text {
            font-size: 2.2rem;
            line-height: 1.4;
            text-shadow: 2px 2px 8px #000, 0 0 20px #000;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        /* Highlight specific keywords */
        .highlight { color: #ff4444; font-weight: bold; }
        .highlight-blue { color: #44aaff; font-weight: bold; }

        /* Skip Button */
        #skip-btn {
            position: absolute;
            right: 34px;
            bottom: 28px;
            width: 82px;
            height: 82px;
            border: 0;
            border-radius: 50%;
            background: rgba(0, 0, 0, .55);
            color: #c8c8c8;
            cursor: pointer;
            z-index: 20;
            font-family: inherit;
            font-size: .72rem;
            letter-spacing: .12em;
            text-transform: uppercase;
            display: grid;
            place-items: center;
            transition: transform .25s ease, color .25s ease, background .25s ease;
            box-shadow: 0 0 24px rgba(0,0,0,.45);
        }

        #skip-btn::before,
        #skip-btn::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
        }

        #skip-btn::before {
            border: 1px solid rgba(255,255,255,.18);
        }

        #skip-btn::after {
            padding: 3px;
            background: conic-gradient(
                rgba(255,255,255,.9) var(--skip-progress, 0%),
                rgba(255,255,255,.12) var(--skip-progress, 0%)
            );
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        #skip-btn span {
            position: relative;
            z-index: 1;
        }

        #skip-btn:hover {
            color: #fff;
            background: rgba(20,20,20,.72);
            transform: scale(1.06);
        }

        #skip-btn:active {
            transform: scale(.96);
        }

        #skip-btn.is-complete {
            color: #fff;
        }

        #text-container {
            perspective: 900px;
        }

        #tutorial-text {
            transform: translateY(12px) scale(.985);
            filter: blur(4px);
            transition:
                opacity .75s cubic-bezier(.22,.61,.36,1),
                transform .85s cubic-bezier(.22,.61,.36,1),
                filter .75s ease;
        }

        #tutorial-text.is-visible {
            opacity: 1;
            transform: translateY(0) scale(1);
            filter: blur(0);
        }

        #bg-layer {
            transition: opacity 1.2s ease, background-image 0s;
        }

    </style>
</head>
<body>

    <audio id="bg-music" src="../Sounds/freesound_community-scary-ambient-05-17666.mp3" loop></audio>

    <div id="start-screen">
        <div id="start-text">[Click anywhere to start]</div>
    </div>

    <div id="bg-layer"></div>
    <div id="static-overlay"></div>

    <div id="text-container">
        <div id="tutorial-text"></div>
    </div>

    <button id="skip-btn" onclick="startGame()" aria-label="Skip intro"><span>SKIP</span></button>

    <script>
        // Array of tutorial slides matching text to background images
        const tutorialSlides = [
            { text: "Your shift lasts 7 Hours. Complete your quotas to leave early.", img: "../StoryScenes/Presidential-room.jpg" },
            { text: "LEFT TAB: Deportations. Click and sign 10 papers. Each takes 5 seconds.", img: "../StoryScenes/Conference room.jpg" },
            { text: "RIGHT TAB: Missile Strikes. Hold button for 10 seconds. Quota: 5.", img: "../StoryScenes/Storage.jpg" },
            { text: "THREAT 1: <span class='highlight'>ELONG MUST</span>. He moves through the facility.", img: "../StoryScenes/Diner.jpg" },
            { text: "If you fail to launch missiles fast enough, he speeds up.", img: "../StoryScenes/Kitchen.jpg" },
            { text: "Watch the cameras. If a feed flickers black, he has moved. Close the door to block him.", img: "../StoryScenes/Janitor-room.jpg" },
            { text: "THREAT 2: <span class='highlight'>???</span>. He is mostly stationary.", img: "../StoryScenes/Guest-room.jpg" },
            { text: "If you neglect deportations, he will bypass cameras and rush your room.", img: "../StoryScenes/Conference room.jpg" },
            { text: "If you see a flickering <span class='highlight'>CAUTION</span> symbol on the cameras, close ALL doors.", img: "../StoryScenes/Presidential-room.jpg" },
            { text: "Doors consume power. Cameras do not. If power reaches 0%, you will not survive.", img: "../StoryScenes/Storage.jpg" },
            { text: "Good luck.", img: "../StoryScenes/Presidential-room.jpg" }
        ];

        const bgLayer = document.getElementById('bg-layer');
        const textElement = document.getElementById('tutorial-text');
        const skipButton = document.getElementById('skip-btn');
        let currentSlide = 0;
        let slideTimer = null;
        let progressFrame = null;
        let introStarted = false;

        const SLIDE_DURATION = 5000;
        const TEXT_FADE_OUT = 650;

        function updateSkipProgress(progress) {
            skipButton.style.setProperty('--skip-progress', (Math.min(100, Math.max(0, progress * 100))) + '%');
        }

        function animateSlideProgress(startTime) {
            if (!introStarted) return;

            const elapsed = performance.now() - startTime;
            const slideProgress = Math.min(1, elapsed / SLIDE_DURATION);
            const overallProgress = (currentSlide + slideProgress) / tutorialSlides.length;

            updateSkipProgress(overallProgress);

            if (slideProgress < 1) {
                progressFrame = requestAnimationFrame(function() {
                    animateSlideProgress(startTime);
                });
            }
        }

        function showSlide() {
            if (currentSlide >= tutorialSlides.length) {
                skipButton.classList.add('is-complete');
                updateSkipProgress(1);
                setTimeout(startGame, 500);
                return;
            }

            textElement.classList.remove('is-visible');
            bgLayer.style.opacity = 0;

            clearTimeout(slideTimer);
            if (progressFrame) cancelAnimationFrame(progressFrame);

            setTimeout(function() {
                const slide = tutorialSlides[currentSlide];

                bgLayer.style.backgroundImage = "url('" + slide.img + "')";
                textElement.innerHTML = slide.text;

                requestAnimationFrame(function() {
                    bgLayer.style.opacity = .5;
                    textElement.classList.add('is-visible');
                });

                const slideStart = performance.now();
                animateSlideProgress(slideStart);

                slideTimer = setTimeout(function() {
                    currentSlide++;
                    showSlide();
                }, SLIDE_DURATION);
            }, TEXT_FADE_OUT);
        }

        document.getElementById('start-screen').addEventListener('click', function() {
            const bgMusic = document.getElementById('bg-music');
            bgMusic.play().catch(function(e) {
                console.log("Audio play failed:", e);
            });

            this.style.opacity = '0';
            setTimeout(() => this.remove(), 1000);

            introStarted = true;
            setTimeout(showSlide, 450);
        }, { once: true });

        function startGame() {
            clearTimeout(slideTimer);
            if (progressFrame) cancelAnimationFrame(progressFrame);
            window.location.href = 'night1.html';
        }
    </script>
</body>
</html>
