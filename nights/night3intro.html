<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Night 3 - Intro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            overflow: hidden;
            text-align: center;
            user-select: none;
        }

        #start-screen {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
            font-size: 1.5rem;
            color: #aaa;
            background: #000;
            animation: slowPulse 2s infinite;
            transition: opacity 1s ease;
        }

        @keyframes slowPulse {
            0%, 100% { opacity: .3; }
            50% { opacity: 1; }
        }

        #scene-bg {
            position: fixed;
            inset: -6%;
            background:
                radial-gradient(circle at center, rgba(255,255,255,.045), transparent 48%),
                radial-gradient(circle at 50% 55%, rgba(80,80,80,.07), transparent 62%),
                #000;
            opacity: 0;
            transform: scale(1);
            z-index: 1;
            transition: opacity 1.4s ease, transform 7s ease;
        }

        #scene-bg.is-visible {
            opacity: 1;
            transform: scale(1.055);
        }

        #static-overlay {
            position: fixed;
            inset: 0;
            z-index: 5;
            pointer-events: none;
            opacity: .42;
            background:
                repeating-linear-gradient(
                    0deg,
                    rgba(255,255,255,.025) 0,
                    rgba(255,255,255,.025) 1px,
                    transparent 1px,
                    transparent 4px
                );
        }

        #static-overlay::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                90deg,
                rgba(255,0,0,.018),
                transparent 30%,
                transparent 70%,
                rgba(0,120,255,.018)
            );
        }

        #vignette {
            position: fixed;
            inset: 0;
            z-index: 6;
            pointer-events: none;
            background: radial-gradient(circle, transparent 30%, rgba(0,0,0,.78) 100%);
        }

        #text-container {
            position: fixed;
            top: 50%;
            left: 50%;
            width: min(950px, 84vw);
            transform: translate(-50%, -50%);
            z-index: 10;
            perspective: 900px;
        }

        #warning-text {
            font-size: clamp(1.3rem, 2.5vw, 2.2rem);
            line-height: 1.55;
            opacity: 0;
            transform: translateY(12px) scale(.985);
            filter: blur(4px);
            text-shadow:
                0 0 10px rgba(255,255,255,.42),
                0 0 28px rgba(0,0,0,1);
            transition:
                opacity .8s cubic-bezier(.22,.61,.36,1),
                transform .85s cubic-bezier(.22,.61,.36,1),
                filter .75s ease;
        }

        #warning-text.is-visible {
            opacity: 1;
            transform: translateY(0) scale(1);
            filter: blur(0);
        }

        #night-text {
            font-size: clamp(3.8rem, 9vw, 7rem);
            font-weight: bold;
            letter-spacing: clamp(7px, 1.5vw, 16px);
            opacity: 0;
            transform: scale(.82);
            filter: blur(8px);
            text-shadow:
                0 0 12px rgba(255,255,255,.55),
                0 0 42px rgba(255,255,255,.14),
                0 0 80px rgba(0,0,0,1);
            transition:
                opacity .25s ease,
                transform .45s cubic-bezier(.12,.8,.25,1),
                filter .35s ease;
        }

        #night-text.is-visible {
            opacity: 1;
            transform: scale(1);
            filter: blur(0);
        }

        #skip-btn {
            position: fixed;
            right: 34px;
            bottom: 28px;
            width: 82px;
            height: 82px;
            border: 0;
            border-radius: 50%;
            background: rgba(0,0,0,.58);
            color: #c8c8c8;
            cursor: pointer;
            z-index: 20;
            font-family: inherit;
            font-size: .72rem;
            letter-spacing: .12em;
            text-transform: uppercase;
            display: grid;
            place-items: center;
            transition: transform .25s ease, color .25s ease, background .25s ease;
            box-shadow: 0 0 24px rgba(0,0,0,.5);
        }

        #skip-btn::before,
        #skip-btn::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
        }

        #skip-btn::before {
            border: 1px solid rgba(255,255,255,.18);
        }

        #skip-btn::after {
            padding: 3px;
            background: conic-gradient(
                rgba(255,255,255,.9) var(--skip-progress, 0%),
                rgba(255,255,255,.12) var(--skip-progress, 0%)
            );
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        #skip-btn span {
            position: relative;
            z-index: 1;
        }

        #skip-btn:hover {
            color: #fff;
            background: rgba(20,20,20,.75);
            transform: scale(1.06);
        }

        #skip-btn:active {
            transform: scale(.96);
        }

        #boom-flash {
            position: fixed;
            inset: 0;
            z-index: 8;
            pointer-events: none;
            background: #fff;
            opacity: 0;
        }

        #boom-flash.is-active {
            animation: boomFlash .32s ease-out;
        }

        @keyframes boomFlash {
            0% { opacity: .22; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <audio id="bg-music" src="../Sounds/dragon-studio-horror-background-music-443137.mp3"></audio>
    <audio id="boom-sound" src="../Sounds/11325622-big-cine-boom-sound-effect-245851.mp3"></audio>

    <div id="start-screen">[Click to continue to Night 3]</div>
    <div id="scene-bg"></div>
    <div id="static-overlay"></div>
    <div id="vignette"></div>
    <div id="boom-flash"></div>

    <div id="text-container">
        <div id="warning-text">"You cannot hide from him, if you see him, just know he can't see in the dark."</div>
        <div id="night-text">NIGHT 3</div>
    </div>

    <button id="skip-btn" aria-label="Skip Night 3 intro"><span>SKIP</span></button>

    <script>
        const startScreen = document.getElementById('start-screen');
        const warningText = document.getElementById('warning-text');
        const nightText = document.getElementById('night-text');
        const sceneBg = document.getElementById('scene-bg');
        const boomFlash = document.getElementById('boom-flash');
        const bgMusic = document.getElementById('bg-music');
        const boomSound = document.getElementById('boom-sound');
        const skipButton = document.getElementById('skip-btn');

        const INTRO_DURATION = 18500;
        let introStarted = false;
        let introTimer = null;
        let progressFrame = null;
        let sequenceStart = 0;
        let audioFadeTimer = null;

        function updateProgress(progress) {
            skipButton.style.setProperty(
                '--skip-progress',
                (Math.min(100, Math.max(0, progress * 100))) + '%'
            );
        }

        function animateProgress() {
            if (!introStarted) return;

            const progress = Math.min(
                1,
                (performance.now() - sequenceStart) / INTRO_DURATION
            );

            updateProgress(progress);

            if (progress < 1) {
                progressFrame = requestAnimationFrame(animateProgress);
            }
        }

        function fadeAudio() {
            clearInterval(audioFadeTimer);

            audioFadeTimer = setInterval(() => {
                if (bgMusic.volume > 0.1) {
                    bgMusic.volume = Math.max(0, bgMusic.volume - 0.1);
                } else {
                    bgMusic.volume = 0;
                    bgMusic.pause();
                    clearInterval(audioFadeTimer);
                }
            }, 200);
        }

        function finishIntro() {
            clearTimeout(introTimer);
            if (progressFrame) cancelAnimationFrame(progressFrame);
            clearInterval(audioFadeTimer);
            window.location.href = 'night3.html';
        }

        function startIntro() {
            if (introStarted) return;
            introStarted = true;

            bgMusic.volume = 0.6;
            bgMusic.play().catch(e => console.log("Audio play failed:", e));

            startScreen.style.opacity = '0';

            setTimeout(() => {
                startScreen.remove();
                sequenceStart = performance.now();
                sceneBg.classList.add('is-visible');

                setTimeout(() => {
                    warningText.classList.add('is-visible');
                }, 500);

                setTimeout(() => {
                    warningText.classList.remove('is-visible');
                }, 7500);

                setTimeout(() => {
                    nightText.classList.add('is-visible');
                    boomFlash.classList.remove('is-active');
                    void boomFlash.offsetWidth;
                    boomFlash.classList.add('is-active');
                    boomSound.currentTime = 0;
                    boomSound.play().catch(e => console.log("Boom play failed:", e));
                }, 10500);

                setTimeout(() => {
                    nightText.style.transition = 'opacity 3s ease-out, transform 3s ease-out, filter 2s ease-out';
                    nightText.style.opacity = '0';
                    nightText.style.transform = 'scale(1.06)';
                    nightText.style.filter = 'blur(3px)';
                    fadeAudio();
                }, 14500);

                progressFrame = requestAnimationFrame(animateProgress);

                introTimer = setTimeout(finishIntro, INTRO_DURATION);
            }, 900);
        }

        startScreen.addEventListener('click', startIntro, { once: true });
        skipButton.addEventListener('click', () => {
            if (!introStarted) {
                startIntro();
            } else {
                finishIntro();
            }
        });

        updateProgress(0);
    </script>

</body>
</html>
