<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Night 2 - Intro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            overflow: hidden;
            text-align: center;
            user-select: none;
        }

        #start-screen {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
            font-size: 1.5rem;
            color: #aaa;
            background: #000;
            animation: slowPulse 2s infinite;
            transition: opacity 1s ease;
        }

        @keyframes slowPulse {
            0%, 100% { opacity: .3; }
            50% { opacity: 1; }
        }

        #scene-bg {
            position: fixed;
            inset: -6%;
            background:
                radial-gradient(circle at center, rgba(255,255,255,.05), transparent 55%),
                #000;
            opacity: 0;
            transform: scale(1);
            z-index: 1;
            transition: opacity 1.4s ease, transform 7s ease;
        }

        #scene-bg.is-visible {
            opacity: 1;
            transform: scale(1.05);
        }

        #static-overlay {
            position: fixed;
            inset: 0;
            z-index: 5;
            pointer-events: none;
            opacity: .38;
            background: repeating-linear-gradient(
                0deg,
                rgba(255,255,255,.025) 0,
                rgba(255,255,255,.025) 1px,
                transparent 1px,
                transparent 4px
            );
        }

        #vignette {
            position: fixed;
            inset: 0;
            z-index: 6;
            pointer-events: none;
            background: radial-gradient(circle, transparent 35%, rgba(0,0,0,.72) 100%);
        }

        #text-container {
            position: fixed;
            top: 50%;
            left: 50%;
            width: min(900px, 82vw);
            transform: translate(-50%, -50%);
            z-index: 10;
            perspective: 900px;
        }

        #intro-text {
            font-size: clamp(1.5rem, 2.6vw, 2.25rem);
            line-height: 1.5;
            opacity: 0;
            transform: translateY(12px) scale(.985);
            filter: blur(4px);
            text-shadow: 0 0 10px rgba(255,255,255,.45), 0 0 28px rgba(0,0,0,1);
            transition:
                opacity .8s cubic-bezier(.22,.61,.36,1),
                transform .85s cubic-bezier(.22,.61,.36,1),
                filter .75s ease;
        }

        #intro-text.is-visible {
            opacity: 1;
            transform: translateY(0) scale(1);
            filter: blur(0);
        }

        #skip-btn {
            position: fixed;
            right: 34px;
            bottom: 28px;
            width: 82px;
            height: 82px;
            border: 0;
            border-radius: 50%;
            background: rgba(0,0,0,.58);
            color: #c8c8c8;
            cursor: pointer;
            z-index: 20;
            font-family: inherit;
            font-size: .72rem;
            letter-spacing: .12em;
            text-transform: uppercase;
            display: grid;
            place-items: center;
            transition: transform .25s ease, color .25s ease, background .25s ease;
            box-shadow: 0 0 24px rgba(0,0,0,.5);
        }

        #skip-btn::before,
        #skip-btn::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
        }

        #skip-btn::before {
            border: 1px solid rgba(255,255,255,.18);
        }

        #skip-btn::after {
            padding: 3px;
            background: conic-gradient(
                rgba(255,255,255,.9) var(--skip-progress, 0%),
                rgba(255,255,255,.12) var(--skip-progress, 0%)
            );
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        #skip-btn span {
            position: relative;
            z-index: 1;
        }

        #skip-btn:hover {
            color: #fff;
            background: rgba(20,20,20,.75);
            transform: scale(1.06);
        }

        #skip-btn:active {
            transform: scale(.96);
        }
    </style></head>
<body>

    <audio id="intro-audio" src="../Sounds/alesiadavina-horror-sound-lurking-horror-monster-189948.mp3"></audio>

    <div id="start-screen">[Click to continue to night 2]</div>
    <div id="scene-bg"></div>
    <div id="static-overlay"></div>
    <div id="vignette"></div>

    <div id="text-container">
        <div id="intro-text"></div>
    </div>

    <button id="skip-btn" aria-label="Skip Night 2 intro"><span>SKIP</span></button>

    <script>
        const startScreen = document.getElementById('start-screen');
        const textElement = document.getElementById('intro-text');
        const introAudio = document.getElementById('intro-audio');
        const skipButton = document.getElementById('skip-btn');

        const messages = [
            "Must was not the only one infected.",
            "Keep an eye on the guest room.<br>If the door is wide open, be prepared."
        ];

        const INTRO_DURATION = 14000;
        const MESSAGE_DURATION = 5000;
        const FADE_GAP = 650;

        let introStarted = false;
        let introTimer = null;
        let progressFrame = null;
        let sequenceStart = 0;

        function updateProgress(progress) {
            skipButton.style.setProperty(
                '--skip-progress',
                (Math.min(100, Math.max(0, progress * 100))) + '%'
            );
        }

        function animateProgress() {
            if (!introStarted) return;

            const progress = Math.min(
                1,
                (performance.now() - sequenceStart) / INTRO_DURATION
            );

            updateProgress(progress);

            if (progress < 1) {
                progressFrame = requestAnimationFrame(animateProgress);
            }
        }

        function showMessage(index) {
            textElement.classList.remove('is-visible');

            setTimeout(function() {
                textElement.innerHTML = messages[index];
                textElement.classList.add('is-visible');
            }, FADE_GAP);
        }

        function startIntro() {
            if (introStarted) return;
            introStarted = true;

            introAudio.play().catch(function(e) {
                console.log("Audio play failed:", e);
            });

            startScreen.style.opacity = '0';

            setTimeout(function() {
                startScreen.remove();
                sequenceStart = performance.now();
                document.getElementById('scene-bg').classList.add('is-visible');

                showMessage(0);

                setTimeout(function() {
                    showMessage(1);
                }, MESSAGE_DURATION);

                setTimeout(function() {
                    textElement.classList.remove('is-visible');
                }, MESSAGE_DURATION * 2);

                progressFrame = requestAnimationFrame(animateProgress);

                introTimer = setTimeout(function() {
                    window.location.href = 'night2.html';
                }, INTRO_DURATION);
            }, 900);
        }

        function skipIntro() {
            if (!introStarted) {
                startIntro();
            } else {
                clearTimeout(introTimer);
                if (progressFrame) cancelAnimationFrame(progressFrame);
                window.location.href = 'night2.html';
            }
        }

        startScreen.addEventListener('click', startIntro, { once: true });
        skipButton.addEventListener('click', skipIntro);
        updateProgress(0);
    </script>

</body></body>
</html>
