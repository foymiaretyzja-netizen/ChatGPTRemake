<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story Intro - Five Nights at the Black House</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--white:#fff;--muted:rgba(255,255,255,.58);--line:rgba(255,255,255,.13);--accent:#fff}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--white);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{user-select:none}
#start-screen{position:fixed;inset:0;background:#030303;display:grid;place-items:center;z-index:100;cursor:pointer;transition:opacity 1.1s ease}
.start-inner{text-align:center}
.start-logo{width:64px;height:64px;margin:0 auto 26px;border:1px solid rgba(255,255,255,.22);border-radius:20px;display:grid;place-items:center;background:linear-gradient(145deg,#171717,#050505);box-shadow:0 0 60px rgba(255,255,255,.08)}
.start-logo:before{content:"";width:21px;height:21px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 22px rgba(255,255,255,.22)}
#start-text{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.65);animation:pulse 2.2s ease-in-out infinite}
.start-sub{margin-top:10px;font-size:11px;color:rgba(255,255,255,.28);letter-spacing:.08em}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
#intro-container{position:relative;width:100vw;height:100vh;background:#000}
.bg-image{position:absolute;inset:-3%;background-size:cover;background-position:center;opacity:0;filter:brightness(.48) saturate(.72);transition:opacity 2.5s ease-in-out;animation:slowZoom 18s linear infinite alternate}
.bg-image.active{opacity:1}
@keyframes slowZoom{from{transform:scale(1)}to{transform:scale(1.07)}}
#vignette{position:absolute;inset:0;background:radial-gradient(circle at center,transparent 15%,rgba(0,0,0,.12) 45%,rgba(0,0,0,.84) 100%),linear-gradient(to bottom,rgba(0,0,0,.28),transparent 28%,transparent 65%,rgba(0,0,0,.8));pointer-events:none}
#grain{position:absolute;inset:0;opacity:.055;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");mix-blend-mode:screen}
#topbar{position:absolute;top:0;left:0;right:0;height:82px;padding:0 34px;display:flex;align-items:center;justify-content:space-between;z-index:5;background:linear-gradient(to bottom,rgba(0,0,0,.52),transparent)}
.brand{font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:rgba(255,255,255,.66)}
.chapter{font-size:11px;color:rgba(255,255,255,.42);letter-spacing:.12em}
#text-box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(900px,84vw);text-align:center;z-index:4}
#story-text{font-family:Georgia,"Times New Roman",serif;font-size:clamp(21px,3vw,38px);line-height:1.45;letter-spacing:-.015em;text-shadow:0 3px 18px #000,0 0 50px #000}
.cursor{display:inline-block;margin-left:3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#progress-bar{position:absolute;left:50%;bottom:126px;transform:translateX(-50%);width:min(420px,58vw);height:2px;background:rgba(255,255,255,.15);z-index:5;overflow:hidden}
#progress-fill{height:100%;width:0;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.65);transition:width .2s ease}
#skip-area{position:absolute;right:30px;bottom:27px;z-index:6;display:flex;align-items:center;gap:13px}
.skip-label{text-align:right}
.skip-label strong{display:block;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.8)}
.skip-label span{display:block;margin-top:3px;font-size:10px;color:rgba(255,255,255,.38)}
.hold-wrap{position:relative;width:68px;height:68px}
.hold-ring{position:absolute;inset:0;transform:rotate(-90deg);filter:drop-shadow(0 0 7px rgba(255,255,255,.2))}
.hold-ring circle{fill:none;stroke-width:3}
.ring-bg{stroke:rgba(255,255,255,.13)}
.ring-progress{stroke:#fff;stroke-linecap:round;stroke-dasharray:194.78;stroke-dashoffset:194.78}
#skip-indicator{position:absolute;inset:7px;border:1px solid rgba(255,255,255,.22);border-radius:50%;background:rgba(8,8,8,.48);backdrop-filter:blur(12px);display:grid;place-items:center;color:#fff;font-size:9px;font-weight:700;letter-spacing:.12em;cursor:pointer;transition:transform .15s ease,background .2s ease,border-color .2s ease}
#skip-indicator:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.42)}
#skip-indicator.holding{transform:scale(.93);background:rgba(255,255,255,.14);border-color:#fff}
#skip-indicator:focus-visible{outline:2px solid #fff;outline-offset:4px}
#dots{position:absolute;left:34px;bottom:42px;display:flex;gap:7px;z-index:5}
.dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.25);transition:.25s}
.dot.active{width:20px;border-radius:5px;background:#fff;box-shadow:0 0 9px rgba(255,255,255,.35)}
.fade-text{animation:textIn 1.2s ease}
@keyframes textIn{from{opacity:0;transform:translateY(10px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
@media(max-width:650px){
 #topbar{padding:0 18px;height:65px}
 #text-box{width:88vw}
 #story-text{font-size:clamp(20px,6vw,29px);line-height:1.5}
 #progress-bar{bottom:111px;width:54vw}
 #dots{left:18px;bottom:31px}
 #skip-area{right:16px;bottom:18px}
 .skip-label{display:none}
}
</style>
</head>
<body>
<audio id="bg-music" src="Sounds/universfield-horror-background-atmosphere-06-199279.mp3" loop></audio>

<div id="start-screen">
  <div class="start-inner">
    <div class="start-logo"></div>
    <div id="start-text">Click anywhere to start</div>
    <div class="start-sub">The story begins in darkness.</div>
  </div>
</div>

<div id="intro-container">
  <div id="layer1" class="bg-image active"></div>
  <div id="layer2" class="bg-image"></div>
  <div id="vignette"></div>
  <div id="grain"></div>

  <header id="topbar">
    <div class="brand">Five Nights at the Black House</div>
    <div class="chapter" id="chapter">01 / 04</div>
  </header>

  <main id="text-box">
    <p id="story-text"><span id="typewriter"></span><span class="cursor">|</span></p>
  </main>

  <div id="progress-bar"><div id="progress-fill"></div></div>
  <div id="dots"></div>

  <div id="skip-area">
    <div class="skip-label">
      <strong>Hold to skip</strong>
      <span>Release to cancel</span>
    </div>
    <div class="hold-wrap">
      <svg class="hold-ring" viewBox="0 0 68 68" aria-hidden="true">
        <circle class="ring-bg" cx="34" cy="34" r="31"></circle>
        <circle class="ring-progress" id="hold-progress" cx="34" cy="34" r="31"></circle>
      </svg>
      <button id="skip-indicator" aria-label="Hold to skip">SKIP</button>
    </div>
  </div>
</div>

<script>
const images=['StoryScenes/Tehran.jpg','StoryScenes/SE3EN.jpg','StoryScenes/uNk5K.jpg'];
const storyParts=[
"The Oval Office of the Black House is a suffocating tomb, lit only by a sputtering fluorescent bulb that casts long, jittery shadows.",
"Spread across the mahogany desk are the crushing burdens of a besieged presidency: a stack of urgent deportation orders and a tactical terminal demanding missile strikes against Irun.",
"But the true nightmare prowls just outside the thick oak doors. The Liberalist Virus of 2022 has mutated Elong Must and Charrlie Hirk from trusted allies into corrupted, cybernetic husks.",
"Now, they drag themselves through the velvet-lined corridors of the West Wing, hunting for the last uninfected mind to consume."
];

const layer1=document.getElementById('layer1');
const layer2=document.getElementById('layer2');
const typewriter=document.getElementById('typewriter');
const chapter=document.getElementById('chapter');
const progressFill=document.getElementById('progress-fill');
const dots=document.getElementById('dots');
const skipBtn=document.getElementById('skip-indicator');
const holdProgress=document.getElementById('hold-progress');
const startScreen=document.getElementById('start-screen');
const bgMusic=document.getElementById('bg-music');

let currentImageIndex=0,activeLayer=1,currentPart=0,charIndex=0,started=false;
let holdStart=0,holding=false,holdFrame=0;
const holdDuration=1300;
const circumference=194.78;

function renderProgress(){
 const pct=(currentPart/storyParts.length)*100;
 progressFill.style.width=pct+'%';
 chapter.textContent=String(Math.min(currentPart+1,storyParts.length)).padStart(2,'0')+' / '+String(storyParts.length).padStart(2,'0');
 dots.innerHTML=storyParts.map((_,i)=>'<span class="dot '+(i===currentPart?'active':'')+'"></span>').join('');
}

function changeImage(){
 currentImageIndex=(currentImageIndex+1)%images.length;
 const next='url("'+images[currentImageIndex]+'")';
 if(activeLayer===1){
  layer2.style.backgroundImage=next;layer2.classList.add('active');layer1.classList.remove('active');activeLayer=2;
 }else{
  layer1.style.backgroundImage=next;layer1.classList.add('active');layer2.classList.remove('active');activeLayer=1;
 }
}

function typeWriter(){
 if(!started)return;
 if(currentPart>=storyParts.length){
  setTimeout(()=>{window.location.href='title.html'},900);
  return;
 }
 const text=storyParts[currentPart];
 if(charIndex<text.length){
  typewriter.textContent+=text.charAt(charIndex++);
  setTimeout(typeWriter,Math.random()*28+20);
 }else{
  setTimeout(()=>{
   if(!started)return;
   typewriter.textContent='';
   charIndex=0;
   currentPart++;
   renderProgress();
   typewriter.parentElement.classList.remove('fade-text');
   void typewriter.parentElement.offsetWidth;
   typewriter.parentElement.classList.add('fade-text');
   typeWriter();
  },2800);
 }
}

startScreen.addEventListener('click',()=>{
 if(started)return;
 started=true;
 bgMusic.play().catch(()=>{});
 startScreen.style.opacity='0';
 setTimeout(()=>startScreen.remove(),1100);
 layer1.style.backgroundImage='url("'+images[0]+'")';
 renderProgress();
 setInterval(changeImage,6000);
 setTimeout(typeWriter,700);
});

function resetHold(){
 holding=false;
 cancelAnimationFrame(holdFrame);
 holdProgress.style.strokeDashoffset=circumference;
 skipBtn.classList.remove('holding');
}
function holdTick(now){
 if(!holding)return;
 const pct=Math.min((now-holdStart)/holdDuration,1);
 holdProgress.style.strokeDashoffset=circumference*(1-pct);
 if(pct>=1){
  holding=false;
  window.location.href='title.html';
  return;
 }
 holdFrame=requestAnimationFrame(holdTick);
}
function startHold(e){
 e.preventDefault();
 if(holding)return;
 holding=true;
 holdStart=performance.now();
 skipBtn.classList.add('holding');
 holdFrame=requestAnimationFrame(holdTick);
}
skipBtn.addEventListener('pointerdown',startHold);
['pointerup','pointercancel','pointerleave'].forEach(e=>skipBtn.addEventListener(e,resetHold));
skipBtn.addEventListener('keydown',e=>{
 if((e.code==='Space'||e.code==='Enter')&&!holding)startHold(e);
});
skipBtn.addEventListener('keyup',e=>{
 if(e.code==='Space'||e.code==='Enter')resetHold();
});
</script>
</body>
</html>
